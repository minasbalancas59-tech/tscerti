# ═══════════════════════════════════════════════════════════════
# tscerti.totalscale.com.br — site de planos do TSCert
#
# Serve a MESMA tscert.html que já está dentro do sistema, através
# do proxy para a API. Não há cópia do arquivo: mexeu na página, muda
# nos dois endereços.
#
# Instalação:
#   sudo nano /etc/nginx/sites-available/tscerti     (cole isto)
#   sudo ln -s /etc/nginx/sites-available/tscerti /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requer o certificado emitido antes:
#   sudo certbot certonly --nginx -d tscerti.totalscale.com.br
#
# João, 09/09/2026.
# ═══════════════════════════════════════════════════════════════

# ── HTTP: só redireciona para HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name tscerti.totalscale.com.br;

    # Deixa o certbot renovar sem precisar parar o nginx
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: a página de planos ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tscerti.totalscale.com.br;

    ssl_certificate     /etc/letsencrypt/live/tscerti.totalscale.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tscerti.totalscale.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # A raiz do domínio abre os planos, sem o /tscert.html no endereço.
    # A barra final no proxy_pass é o que troca o caminho.
    location = / {
        proxy_pass http://127.0.0.1:8080/tscert.html;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Demais caminhos (CSS, imagens, o próprio /tscert.html) vão para a
    # API normalmente — é assim que a página carrega o visual.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Quem tentar entrar no SISTEMA por este endereço é mandado para o
    # endereço certo: aqui é vitrine, não é onde se faz login.
    location = /index.html {
        return 301 https://certificados.totalscale.com.br/;
    }
    location = /portal.html {
        return 301 https://certificados.totalscale.com.br/portal.html;
    }

    # Se a API estiver fora do ar durante um deploy
    error_page 502 503 504 = @fora;
    location @fora {
        default_type text/html;
        add_header Retry-After 30 always;
        return 503 '<!doctype html><html lang="pt-BR"><meta charset="utf-8">
<title>TSCert</title><body style="font-family:system-ui;text-align:center;padding:60px">
<h1>Voltamos já</h1><p>Estamos atualizando o sistema. Tente de novo em instantes.</p>
<p>Ou fale com a gente: <b>(31) 97160-7105</b></p></body></html>';
    }

    access_log /var/log/nginx/tscerti-access.log;
    error_log  /var/log/nginx/tscerti-error.log;
}
