# ═══════════════════════════════════════════════════════════════
# Configuração nginx da VPS com página de manutenção automática
#
# COMO FUNCIONA:
#   - Requisições normais vão para a API (127.0.0.1:8080).
#   - Se a API estiver fora do ar (deploy/reinício), o nginx captura
#     o erro 502/503/504 e mostra a página manutencao.html.
#   - Quando a API volta, tudo normaliza sozinho (sem intervenção).
#
# INSTALAÇÃO:
#   1) Copie manutencao.html para /var/www/manutencao/manutencao.html
#      sudo mkdir -p /var/www/manutencao
#      sudo cp manutencao.html /var/www/manutencao/
#   2) Substitua o server{} do seu site por este (ajuste server_name e SSL).
#   3) sudo nginx -t   (testa a config)
#   4) sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════

server {
    listen 443 ssl http2;
    server_name certificados.minasbalancas.com.br;

    # ── SSL (mantenha os caminhos dos SEUS certificados existentes) ──
    ssl_certificate     /etc/letsencrypt/live/certificados.minasbalancas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certificados.minasbalancas.com.br/privkey.pem;

    client_max_body_size 20m;   # uploads de foto/assinatura

    # ── Página de manutenção (servida quando a API está fora) ──
    # A localização física do arquivo:
    root /var/www/manutencao;

    # Intercepta os erros de "backend indisponível"
    error_page 502 503 504 = @manutencao;

    location @manutencao {
        # Sempre responde com o HTML de manutenção e status 503
        # (503 = "temporariamente indisponível" — correto para deploy).
        default_type text/html;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        try_files /manutencao.html =503;
    }

    # ── Aplicação (proxy para a API que serve tudo) ──
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Se a API não responder rápido durante o deploy, cai no @manutencao
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name certificados.minasbalancas.com.br;
    return 301 https://$host$request_uri;
}
